  <text x="62" y="39" font-size="21" font-weight="700" letter-spacing="1.5" fill="url(#txt)" filter="url(#glow)">CALENDARIO ISOM&#201;TRICO</text>
  <rect x="26" y="50" width="848" height="2" rx="1" fill="url(#rule)"/>
</svg>
