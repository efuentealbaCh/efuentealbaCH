<svg width="900" height="64" viewBox="0 0 900 64" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="100%" stop-color="#b967ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#5b0ea8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b967ff" stop-opacity="0"/>
