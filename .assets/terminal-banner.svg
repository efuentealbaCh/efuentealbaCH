<svg width="800" height="336" viewBox="0 0 800 336" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="55%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#050014"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="50%" stop-color="#5b0ea8"/>
      <stop offset="100%" stop-color="#b967ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0b3d"/>
      <stop offset="100%" stop-color="#12042b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00fff2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="788" height="324" rx="18" fill="url(#borderGrad)" opacity="0.55" filter="url(#glow)"/>
  <rect x="9" y="9" width="782" height="318" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.6"/>
  <rect x="9" y="9" width="782" height="318" rx="16" fill="url(#grid)"/>

  <path d="M9 25 q0 -16 16 -16 h750 q16 0 16 16 v20 h-782 z" fill="url(#barGrad)"/>
  <circle cx="34" cy="26" r="6.5" fill="#ff5f56"/>
  <circle cx="56" cy="26" r="6.5" fill="#ffbd2e"/>
  <circle cx="78" cy="26" r="6.5" fill="#27c93f"/>
  <text x="400" y="31" text-anchor="middle" fill="#c9c9ff" font-size="13" letter-spacing="0.5">eliacer@devspace: ~</text>

  <g font-size="15.5" fill="#c9c9ff">
    <text x="30" y="80"><tspan fill="#00fff2">eliacer@devspace</tspan><tspan fill="#b967ff">:~$</tspan> whoami</text>
    <text x="30" y="106" fill="#f2f2ff">&gt; Eliacer Fuentealba</text>

    <text x="30" y="140"><tspan fill="#00fff2">eliacer@devspace</tspan><tspan fill="#b967ff">:~$</tspan> cat roles.txt</text>
    <text x="30" y="166" fill="#f2f2ff">&gt; Ingeniero Civil en Inform&#225;tica &#183; Full Stack Developer</text>

    <text x="30" y="200"><tspan fill="#00fff2">eliacer@devspace</tspan><tspan fill="#b967ff">:~$</tspan> cat current.json</text>
    <text x="30" y="226" fill="#f2f2ff">&gt; { "building": "Vinculamos v2.0", "learning": ["Node.js","React"] }</text>

    <text x="30" y="260"><tspan fill="#00fff2">eliacer@devspace</tspan><tspan fill="#b967ff">:~$</tspan> echo $HOBBY</text>
    <text x="30" y="286" fill="#f2f2ff">&gt; &#127936; Basketball player</text>

    <text x="30" y="316"><tspan fill="#00fff2">eliacer@devspace</tspan><tspan fill="#b967ff">:~$</tspan> <tspan id="cursor" fill="#00fff2">&#9608;</tspan></text>
  </g>

  <animate href="#cursor" attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
</svg>
